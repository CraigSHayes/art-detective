<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Art Vibe Detective</title>
<style>
  :root {
    --bg: #FAF6F0;
    --card: #FFFFFF;
    --ink: #2B2623;
    --muted: #6B625B;
    --accent: #C85A32;
    --accent-dark: #A64422;
    --gold: #E09F3E;
    --teal: #2A7B76;
    --success: #2E7D32;
    --success-bg: #E8F5E9;
    --warn: #B26A00;
    --warn-bg: #FFF8E1;
    --border: #E6DDD3;
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    overflow-x: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background-color: var(--bg);
    color: var(--ink);
  }

  body {
    padding: 12px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
  }

  .app {
    width: 100%;
    max-width: 480px;
    background: var(--card);
    border-radius: 20px;
    box-shadow: 0 8px 28px rgba(43, 38, 35, 0.08);
    border: 1px solid var(--border);
    padding: 18px;
    overflow: hidden;
  }

  .screen {
    display: none;
  }

  .screen.active {
    display: block;
    animation: fadeIn 0.25s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Header & Scoreboard */
  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    gap: 8px;
    flex-wrap: wrap;
  }

  .round-pill {
    background: #F2ECE4;
    color: var(--ink);
    font-weight: 700;
    font-size: 0.85rem;
    padding: 6px 12px;
    border-radius: 999px;
  }

  .category-pill {
    background: var(--teal);
    color: #fff;
    font-weight: 700;
    font-size: 0.8rem;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    padding: 6px 12px;
    border-radius: 999px;
  }

  .scoreboard {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 14px;
  }

  .score-chip {
    flex: 1 1 0;
    min-width: 64px;
    text-align: center;
    padding: 8px 4px;
    border-radius: 12px;
    background: #F7F3EE;
    border: 2px solid transparent;
    font-size: 0.82rem;
    transition: all 0.2s ease;
  }

  .score-chip.active-turn {
    background: #FFF3EC;
    border-color: var(--accent);
    font-weight: 700;
  }

  .score-chip span {
    display: block;
    font-size: 1.05rem;
    font-weight: 800;
    color: var(--accent);
    margin-top: 2px;
  }

  /* Start Screen */
  .hero-art {
    width: 108px;
    height: 108px;
    margin: 4px auto 12px;
    display: block;
  }

  h1 {
    font-size: 1.7rem;
    text-align: center;
    margin: 0 0 8px;
    color: var(--ink);
    letter-spacing: -0.02em;
  }

  .subtitle {
    text-align: center;
    color: var(--muted);
    font-size: 0.98rem;
    line-height: 1.45;
    margin: 0 0 20px;
  }

  .label-title {
    font-weight: 700;
    font-size: 0.88rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
    margin-bottom: 10px;
    text-align: center;
  }

  .player-selector {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 20px;
  }

  .count-btn {
    min-height: 54px;
    border: 2px solid var(--border);
    background: #FAF6F0;
    border-radius: 14px;
    font-size: 0.96rem;
    font-weight: 700;
    color: var(--ink);
    cursor: pointer;
    touch-action: manipulation;
    transition: background 0.15s ease, border-color 0.15s ease;
  }

  .count-btn.selected {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }

  .primary-btn {
    width: 100%;
    min-height: 58px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 16px;
    font-size: 1.15rem;
    font-weight: 800;
    cursor: pointer;
    touch-action: manipulation;
    box-shadow: 0 4px 12px rgba(200, 90, 50, 0.25);
    transition: transform 0.1s ease, background 0.15s ease;
  }

  .primary-btn:active {
    transform: scale(0.98);
    background: var(--accent-dark);
  }

  /* Game Screen */
  .turn-banner {
    text-align: center;
    font-size: 1.1rem;
    font-weight: 800;
    color: var(--accent);
    margin-bottom: 12px;
  }

  .visual-clue-box {
    background: #F4EFE8;
    border-radius: 16px;
    padding: 12px;
    display: flex;
    justify-content: center;
    align-items: center;
    margin-bottom: 14px;
    border: 1px solid var(--border);
  }

  .visual-clue-box svg {
    width: 144px;
    height: 108px;
    max-width: 100%;
    border-radius: 10px;
    display: block;
  }

  .vibe-clue {
    font-size: 1.05rem;
    line-height: 1.48;
    font-weight: 600;
    color: var(--ink);
    background: #FFFDF9;
    border-left: 4px solid var(--gold);
    padding: 12px 14px;
    border-radius: 0 12px 12px 0;
    margin-bottom: 16px;
    word-wrap: break-word;
  }

  .options-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .option-btn {
    width: 100%;
    min-height: 60px;
    text-align: left;
    padding: 12px 16px;
    background: #FFFFFF;
    border: 2px solid var(--border);
    border-radius: 14px;
    cursor: pointer;
    touch-action: manipulation;
    transition: border-color 0.15s ease, background 0.15s ease;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .option-btn:active:not(:disabled) {
    border-color: var(--accent);
    background: #FFF9F5;
  }

  .option-title {
    font-weight: 800;
    font-size: 1rem;
    color: var(--ink);
    margin-bottom: 2px;
  }

  .option-artist {
    font-size: 0.88rem;
    color: var(--muted);
  }

  .option-btn.wrong {
    background: var(--warn-bg);
    border-color: var(--gold);
    opacity: 0.72;
  }

  .option-btn.correct {
    background: var(--success-bg);
    border-color: var(--success);
    animation: celebrate 0.45s ease;
  }

  @keyframes celebrate {
    0% { transform: scale(1); }
    40% { transform: scale(1.03); }
    70% { transform: scale(0.99); }
    100% { transform: scale(1); }
  }

  .feedback-box {
    margin-top: 14px;
    padding: 14px;
    border-radius: 14px;
    font-size: 0.95rem;
    line-height: 1.42;
    display: none;
  }

  .feedback-box.warn {
    display: block;
    background: var(--warn-bg);
    color: var(--warn);
    font-weight: 700;
    text-align: center;
  }

  .feedback-box.success {
    display: block;
    background: var(--success-bg);
    color: #1B5E20;
  }

  .feedback-box strong {
    display: block;
    font-size: 1.05rem;
    margin-bottom: 4px;
  }

  .next-btn {
    margin-top: 12px;
    width: 100%;
    min-height: 56px;
    background: var(--teal);
    color: #fff;
    border: none;
    border-radius: 14px;
    font-size: 1.08rem;
    font-weight: 800;
    cursor: pointer;
    touch-action: manipulation;
    display: none;
  }

  /* End Screen */
  .winner-banner {
    text-align: center;
    background: #FFF3EC;
    border: 2px solid var(--accent);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 18px;
  }

  .winner-banner h2 {
    margin: 0 0 4px;
    font-size: 1.45rem;
    color: var(--accent);
  }

  .final-list {
    list-style: none;
    padding: 0;
    margin: 0 0 22px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .final-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 16px;
    background: #F7F3EE;
    border-radius: 14px;
    font-weight: 700;
    font-size: 1.05rem;
  }

  .final-item.top-scorer {
    background: #FFF8E1;
    border: 2px solid var(--gold);
  }
</style>
</head>

    svg: `<svg viewBox="0 0 160 120"><rect width="160" height="120" fill="#2D6A4F"/><rect x="24" y="44" width="92" height="14" rx="2" fill="#F4EBD9"/><rect x="48" y="64" width="88" height="14" rx="2" fill="#E6CCB2"/><rect x="74" y="24" width="22" height="65" fill="#7F5539"/><rect x="64" y="78" width="24" height="42" fill="#90E0EF"/></svg>`
  },
  {
    id: 17,
    category: "Architecture",
    title: "Guggenheim Museum Bilbao",
    artist: "Frank Gehry",
    clue: "Ribbons of shimmering titanium twist and collide by the river like a metallic flower or a futuristic ship.",
    fact: "Opened in 1997 in Spain, its titanium panels are only a third of a millimeter thick and ripple slightly in the wind.",
    svg: `<svg viewBox="0 0 160 120"><rect width="160" height="92" fill="#8ECAE6"/><rect y="92" width="160" height="28" fill="#219EBC"/><path d="M18,92 C25,35 70,25 84,92 Z" fill="#ADB5BD"/><path d="M56,92 C72,20 125,30 142,92 Z" fill="#DEE2E6"/><path d="M40,92 C60,48 105,48 122,92 Z" fill="#6C757D"/></svg>`
  },
  {
    id: 18,
    category: "Architecture",
    title: "The Colosseum",
    artist: "Vespasian & Titus",
    clue: "A colossal oval stone honeycomb of stacked arches that once echoed with roaring crowds and stadium spectacles.",
    fact: "Completed in 80 CE in Rome, this travertine limestone amphitheater could hold up to 50,000 spectators.",
    svg: `<svg viewBox="0 0 160 120"><rect width="160" height="120" fill="#A2D2FF"/><path d="M20,104 L20,42 L95,42 L140,72 L140,104 Z" fill="#D4A373"/><rect x="32" y="54" width="12" height="18" rx="6" fill="#6C584C"/><rect x="54" y="54" width="12" height="18" rx="6" fill="#6C584C"/><rect x="76" y="54" width="12" height="18" rx="6" fill="#6C584C"/><rect x="32" y="80" width="12" height="20" rx="6" fill="#6C584C"/><rect x="54" y="80" width="12" height="20" rx="6" fill="#6C584C"/><rect x="76" y="80" width="12" height="20" rx="6" fill="#6C584C"/></svg>`
  }
];

let playerCount = 2;
let scores = [];
let deck = [];
let currentRound = 0;
let totalRounds = 6;
let currentPlayer = 0;
let firstAttempt = true;
let roundSolved = false;

const startScreen = document.getElementById("start-screen");
const gameScreen = document.getElementById("game-screen");
const endScreen = document.getElementById("end-screen");

document.querySelectorAll(".count-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".count-btn").forEach(b => b.classList.remove("selected"));
    btn.classList.add("selected");
    playerCount = parseInt(btn.dataset.count, 10);
  });
});

document.getElementById("start-btn").addEventListener("click", startGame);
document.getElementById("play-again-btn").addEventListener("click", () => {
  endScreen.classList.remove("active");
  startScreen.classList.add("active");
});
document.getElementById("next-btn").addEventListener("click", advanceRound);

function shuffle(arr) {
  const copy = [...arr];
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

function buildBalancedDeck(roundsNeeded) {
  const paintings = shuffle(ARTWORKS.filter(a => a.category === "Painting"));
  const sculptures = shuffle(ARTWORKS.filter(a => a.category === "Sculpture"));
  const architectures = shuffle(ARTWORKS.filter(a => a.category === "Architecture"));

  const selected = [];
  const pools = [paintings, sculptures, architectures];
  for (let i = 0; i < roundsNeeded; i++) {
    const pool = pools[i % 3];
    selected.push(pool.pop());
  }
  return shuffle(selected);
}

function startGame() {
  totalRounds = playerCount === 4 ? 8 : 6;
  scores = Array(playerCount).fill(0);
  currentRound = 0;
  currentPlayer = 0;
  deck = buildBalancedDeck(totalRounds);

  startScreen.classList.remove("active");
  endScreen.classList.remove("active");
  gameScreen.classList.add("active");

  renderRound();
}

function renderScoreboard() {
  const board = document.getElementById("scoreboard");
  board.innerHTML = "";
  scores.forEach((sc, idx) => {
    const chip = document.createElement("div");
    chip.className = "score-chip" + (idx === currentPlayer ? " active-turn" : "");
    chip.innerHTML = `Player ${idx + 1}<span>${sc}</span>`;
    board.appendChild(chip);
  });
}

function renderRound() {
  firstAttempt = true;
  roundSolved = false;

  const target = deck[currentRound];
  document.getElementById("round-label").textContent = `Round ${currentRound + 1} of ${totalRounds}`;
  document.getElementById("category-label").textContent = target.category;
  document.getElementById("turn-banner").textContent = `Player ${currentPlayer + 1}'s Turn`;

  renderScoreboard();

  document.getElementById("visual-clue").innerHTML = target.svg;
  document.getElementById("vibe-clue").textContent = `"${target.clue}"`;

  const feedback = document.getElementById("feedback-box");
  feedback.className = "feedback-box";
  feedback.innerHTML = "";

  const nextBtn = document.getElementById("next-btn");
  nextBtn.style.display = "none";
  nextBtn.textContent = currentRound + 1 === totalRounds ? "See Final Scores" : "Next Round";

  const sameCat = shuffle(ARTWORKS.filter(a => a.id !== target.id && a.category === target.category));
  const otherCat = shuffle(ARTWORKS.filter(a => a.id !== target.id && a.category !== target.category));
  const distractors = [...sameCat, ...otherCat].slice(0, 3);
  const choices = shuffle([target, ...distractors]);

  const optionsList = document.getElementById("options-list");
  optionsList.innerHTML = "";

  choices.forEach(item => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "option-btn";
    btn.innerHTML = `<span class="option-title">${item.title}</span><span class="option-artist">${item.artist}</span>`;
    btn.addEventListener("click", () => handleGuess(btn, item, target));
    optionsList.appendChild(btn);
  });
}

function handleGuess(btn, chosen, target) {
  if (roundSolved) return;

  const feedback = document.getElementById("feedback-box");

  if (chosen.id === target.id) {
    roundSolved = true;
    btn.classList.add("correct");

    document.querySelectorAll(".option-btn").forEach(b => (b.disabled = true));

    if (firstAttempt) {
      scores[currentPlayer] += 1;
      renderScoreboard();
      feedback.className = "feedback-box success";
      feedback.innerHTML = `<strong>Spot on! +1 point for Player ${currentPlayer + 1}</strong>${target.fact}`;
    } else {
      feedback.className = "feedback-box success";
      feedback.innerHTML = `<strong>Mystery solved!</strong>${target.fact}`;
    }

    document.getElementById("next-btn").style.display = "block";
  } else {
    firstAttempt = false;
    btn.classList.add("wrong");
    btn.disabled = true;
    feedback.className = "feedback-box warn";
    feedback.textContent = "Not quite — look closely at the shapes and colors and try again!";
  }
}

function advanceRound() {
  currentRound += 1;
  if (currentRound >= totalRounds) {
    showEndScreen();
  } else {
    currentPlayer = (currentPlayer + 1) % playerCount;
    renderRound();
  }
}

function showEndScreen() {
  gameScreen.classList.remove("active");
  endScreen.classList.add("active");

  const maxScore = Math.max(...scores);
  const winners = [];
  scores.forEach((sc, idx) => {
    if (sc === maxScore) winners.push(`Player ${idx + 1}`);
  });

  const heading = document.getElementById("winner-heading");
  if (winners.length === 1) {
    heading.textContent = `${winners[0]} Wins!`;
  } else {
    heading.textContent = `It's a Tie: ${winners.join(" & ")}!`;
  }

  const list = document.getElementById("final-scores");
  list.innerHTML = "";
  scores.forEach((sc, idx) => {
    const li = document.createElement("li");
    li.className = "final-item" + (sc === maxScore ? " top-scorer" : "");
    li.innerHTML = `<span>Player ${idx + 1}</span><span>${sc} ${sc === 1 ? "pt" : "pts"}</span>`;
    list.appendChild(li);
  });
}
</script>
